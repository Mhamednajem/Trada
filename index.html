<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PeetX | Decentralized Web3 Ecosystem</title>
    <link rel="icon" type="image/png" href="favicon.png" sizes="512x512">
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-main: #050811;
            --bg-card: rgba(13, 19, 33, 0.85);
            --border-color: rgba(0, 240, 255, 0.12);
            --border-glow: rgba(0, 240, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #00ff88;
            --accent-red: #ff3b5c;
            --accent-gold: #ffd700;
            --primary-gradient: linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #8b5cf6 100%);
            --card-gradient: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(10, 15, 30, 0.95) 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden !important;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            position: relative;
        }

        header {
            background: rgba(8, 12, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 1000;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-box i { 
            color: var(--accent-cyan); 
            font-size: 22px; 
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6)); 
        }
        .logo-box span { 
            font-weight: 800; 
            font-size: 20px; 
            letter-spacing: 1px; 
            background: var(--primary-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .header-actions { display: flex; align-items: center; gap: 10px; }
        
        .globe-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .globe-icon-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .btn-action-nav {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(59, 130, 246, 0.1));
            border: 1px solid var(--border-color-glow);
            color: var(--text-primary);
            padding: 8px 16px;
            height: 36px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-action-nav:hover { 
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
            transform: translateY(-1px);
        }
        
        .btn-action-nav.connected-wallet {
            border-color: var(--accent-red);
            color: #ffffff;
            background: rgba(255, 59, 92, 0.2);
            box-shadow: 0 0 15px rgba(255, 59, 92, 0.3);
        }
        
        .page-section { 
            display: none; 
            padding: 0; 
            margin: 0;
            width: 100vw;
            height: calc(100vh - 128px); 
            position: absolute;
            top: 60px;
            left: 0;
        }
        
        .page-section.active { 
            display: block;
        }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            display: block;
            background: transparent;
        }

        .nav-bar-footer {
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(8, 12, 24, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color); 
            display: flex; height: 68px; z-index: 1000;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
        }

        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-secondary); cursor: pointer; gap: 4px; transition: all 0.25s ease;
        }

        .tab-btn i { font-size: 19px; }
        .tab-btn span { font-size: 10px; font-weight: 700; text-align: center; }
        .tab-btn.active { 
            color: var(--accent-cyan); 
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5)); 
        }
        
        #global-entry-loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 17, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .spinner-ring {
            width: 55px;
            height: 55px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top: 3px solid var(--accent-cyan);
            border-right: 3px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        #ui-status-notifier {
            display: none; padding: 12px; border-radius: 12px; font-size: 13px; 
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 10000; text-align: center; font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 90%; max-width: 400px;
        }

        .status-error { background: rgba(255, 59, 92, 0.15); border: 1px solid var(--accent-red); color: #ff6b7e; }
        .status-success { background: rgba(0, 255, 136, 0.15); border: 1px solid var(--accent-green); color: #63ffc4; }

        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- OVERLAY SPINNER -->
    <div id="global-entry-loader">
        <div class="spinner-ring"></div>
        <p style="font-size:13px; color:#fff; font-weight:700;">PeetX Web3 Data Connecting...</p>
    </div>

    <header>
        <div class="logo-box">
            <i class="fa-solid fa-cube"></i>
            <span>PeetX</span>
        </div>
        <div class="header-actions">
            <button class="globe-icon-btn" title="Language Options">
                <i class="fa-solid fa-globe"></i>
            </button>
            
            <button class="btn-action-nav" id="btn-wallet-connect" onclick="handleWalletConnectionTrigger()">
                <i class="fa-solid fa-wallet"></i> <span>ربط المحفظة</span>
            </button>
        </div>
    </header>

    <div id="ui-status-notifier"></div>

    <!-- SECTIONS -->

    <!-- قسم PeetX الرئيسي -->
    <section class="page-section active" id="section-peetx">
        <iframe src="https://mhamednajem.github.io/Trada/PeetX.html" class="content-frame" title="PeetX Main"></iframe>
    </section>

    <!-- قسم الاستثمار -->
    <section class="page-section" id="section-invest">
        <iframe src="https://mhamednajem.github.io/Trada/invest.html" class="content-frame" title="PeetX Invest"></iframe>
    </section>

    <!-- قسم التداول -->
    <section class="page-section" id="section-trade">
        <iframe src="https://mhamednajem.github.io/Trada/trading.html" class="content-frame" title="PeetX Trade"></iframe>
    </section>

    <!-- قسم الأجيال -->
    <section class="page-section" id="section-team">
        <iframe src="https://mhamednajem.github.io/Trada/" class="content-frame" title="PeetX Team"></iframe>
    </section>

    <!-- قسم منظمة DAO -->
    <section class="page-section" id="section-dao">
        <iframe src="https://mhamednajem.github.io/Trada/dao.html" class="content-frame" title="PeetX DAO"></iframe>
    </section>

    <!-- NAVIGATION FOOTER -->
    <nav class="nav-bar-footer">
        <div class="tab-btn active" id="nav-item-peetx" onclick="switchTab('peetx')">
            <i class="fa-solid fa-cube"></i>
            <span>المشروع</span>
        </div>
        <div class="tab-btn" id="nav-item-invest" onclick="switchTab('invest')">
            <i class="fa-solid fa-vault"></i>
            <span>الاستثمار</span>
        </div>
        <div class="tab-btn" id="nav-item-trade" onclick="switchTab('trade')">
            <i class="fa-solid fa-chart-line"></i>
            <span>التداول</span>
        </div>
        <div class="tab-btn" id="nav-item-team" onclick="switchTab('team')">
            <i class="fa-solid fa-users-viewfinder"></i>
            <span>الأجيال</span>
        </div>
        <div class="tab-btn" id="nav-item-dao" onclick="switchTab('dao')">
            <i class="fa-solid fa-landmark"></i>
            <span>منظمة DAO</span>
        </div>
    </nav>

    <script>
        let sessionState = { walletConnected: false, walletAddress: null };

        window.addEventListener('DOMContentLoaded', () => {
            triggerGlobalDataFetchLoader();
        });

        function triggerGlobalDataFetchLoader(durationMs = 800) {
            const loader = document.getElementById('global-entry-loader');
            if(!loader) return;
            loader.style.opacity = '1';
            loader.style.visibility = 'visible';

            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, durationMs);
        }

        function showInternalNotification(message, isSuccess = false) {
            const notifier = document.getElementById('ui-status-notifier');
            if (!notifier) return;
            notifier.innerText = message;
            notifier.className = isSuccess ? "status-success" : "status-error";
            notifier.style.display = "block";
            setTimeout(() => { notifier.style.display = "none"; }, 4000);
        }

        async function handleWalletConnectionTrigger() {
            if (sessionState.walletConnected) {
                sessionState.walletConnected = false;
                document.getElementById('btn-wallet-connect').innerHTML = `<i class="fa-solid fa-wallet"></i> <span>ربط المحفظة</span>`;
                document.getElementById('btn-wallet-connect').classList.remove('connected-wallet');
                showInternalNotification("تم فصل المحفظة", true);
                return;
            }

            if (typeof window.ethereum === 'undefined') {
                showInternalNotification("يرجى فتح الموقع عبر محفظة Web3 متوافقة", false);
                return;
            }

            try {
                triggerGlobalDataFetchLoader(600);
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                sessionState.walletConnected = true;
                sessionState.walletAddress = accounts[0];
                const truncatedAddress = accounts[0].substring(0, 6) + '...' + accounts[0].substring(accounts[0].length - 4);
                
                const connectBtn = document.getElementById('btn-wallet-connect');
                connectBtn.innerHTML = `<i class="fa-solid fa-link-slash"></i> <span>${truncatedAddress}</span>`;
                connectBtn.classList.add('connected-wallet');
                showInternalNotification("تم ربط المحفظة بنجاح!", true);
            } catch (error) {
                showInternalNotification("تم إلغاء الاتصال بالمحفظة", false);
            }
        }

        function switchTab(targetTabId) {
            triggerGlobalDataFetchLoader(400);
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            const selectedSection = document.getElementById(`section-${targetTabId}`);
            if(selectedSection) selectedSection.classList.add('active');
            
            const selectedNavItem = document.getElementById(`nav-item-${targetTabId}`);
            if(selectedNavItem) selectedNavItem.classList.add('active');
        }
    </script>
</body>
</html>
