    <style>
        :root {
            --bg-main: #050811;
            --bg-card: rgba(13, 19, 33, 0.85);
            --border-color: rgba(0, 240, 255, 0.12);
            --border-glow: rgba(0, 240, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #00ff88;
            --accent-red: #ff3b5c;
            --accent-gold: #ffd700;
            --primary-gradient: linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #8b5cf6 100%);
        }

        body {
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden !important;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            position: relative;
            top: 0 !important;
        }

        /* إخفاء إعلانات ونوافذ ترجمة جوجل المزعجة والمنبثقة بالكامل */
        .goog-te-banner-frame,
        .goog-te-banner-frame.skiptranslate,
        .goog-te-gadget-icon,
        .goog-te-balloon-frame,
        #goog-gt-tt,
        .goog-te-spinner-pos,
        .VIpgJd-yA16dz-yA16dz-m9vYo,
        .VIpgJd-Z31sp-s11128,
        .VIpgJd-yA16dz-yA16dz-OWXEXe-s22v3d {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        body {
            top: 0px !important;
        }

        #google_translate_element {
            display: none !important;
            position: absolute;
            left: -9999px;
        }

        /* منع التظليل عند التحويم فوق النصوص المترجمة */
        font {
            background-color: transparent !important;
            box-shadow: none !important;
        }

        body.app-ready {
            opacity: 1 !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background: rgba(8, 12, 24, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 1000;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        .logo-box { display: flex; align-items: center; gap: 8px; }
        .logo-box img.logo-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6));
        }
        .logo-box span { 
            font-weight: 800; 
            font-size: 18px; 
            letter-spacing: 1px; 
            background: var(--primary-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        .lang-selector-container {
            position: relative;
        }

        .globe-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            height: 34px;
            padding: 0 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
            flex-shrink: 0;
        }

        .globe-icon-btn img {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }

        .globe-icon-btn i.arrow-icon {
            font-size: 10px;
            transition: transform 0.25s ease;
        }

        .globe-icon-btn.active i.arrow-icon {
            transform: rotate(180deg);
        }

        .globe-icon-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .flag-dropdown-panel {
            display: none;
            position: absolute;
            top: 42px;
            background: rgba(8, 12, 24, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            width: 260px;
            max-height: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            z-index: 1002;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.2s ease-in-out;
        }

        html[dir="rtl"] .flag-dropdown-panel { right: 0; left: auto; }
        html[dir="ltr"] .flag-dropdown-panel { left: 0; right: auto; }

        .flag-dropdown-panel.show { display: flex; }

        .flag-search-input {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .flag-search-input:focus {
            border-color: var(--accent-cyan);
        }

        .flag-list-scroll {
            overflow-y: auto;
            max-height: 300px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 4px;
        }

        .flag-list-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .flag-list-scroll::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 4px;
        }

        .flag-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 12px;
            color: var(--text-primary);
        }

        .flag-item:hover {
            background: rgba(0, 240, 255, 0.15);
        }

        .flag-item img {
            width: 22px;
            height: 15px;
            object-fit: cover;
            border-radius: 2px;
        }

        .btn-action-nav {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.12), rgba(59, 130, 246, 0.12));
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 6px 12px;
            height: 34px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-action-nav:hover { 
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .btn-action-nav.connected-wallet {
            border-color: var(--accent-green);
            color: #ffffff;
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.25);
        }

        .wallet-menu-container {
            position: relative;
        }

        .wallet-arrow-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .wallet-arrow-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .wallet-arrow-btn i {
            transition: transform 0.3s ease;
        }

        .wallet-arrow-btn.active i {
            transform: rotate(180deg);
        }

        .wallet-dropdown-menu {
            display: none;
            position: absolute;
            top: 42px;
            background: rgba(8, 12, 24, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            width: 200px;
            max-width: calc(100vw - 28px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            z-index: 1001;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.2s ease-in-out;
        }

        html[dir="rtl"] .wallet-dropdown-menu { left: 0; right: auto; }
        html[dir="ltr"] .wallet-dropdown-menu { right: 0; left: auto; }

        .wallet-dropdown-menu.show { display: flex; }

        .wallet-info-text {
            font-size: 10px;
            color: var(--accent-cyan);
            font-weight: 700;
            line-height: 1.4;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            text-align: center;
            word-break: break-word;
        }

        .btn-dropdown-copy {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s ease;
            width: 100%;
        }

        .btn-dropdown-copy:hover {
            background: rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        
        .page-section { 
            display: none; 
            padding: 0; 
            margin: 0;
            width: 100vw;
            height: calc(100vh - 128px); 
            position: absolute;
            top: 60px;
            left: 0;
        }
        
        .page-section.active { display: block; }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            display: block;
            background: transparent;
        }

        .nav-bar-footer {
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(8, 12, 24, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color); 
            display: flex; height: 68px; z-index: 1000;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
        }

        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-secondary); cursor: pointer; gap: 4px; transition: all 0.25s ease;
        }

        .tab-btn i { font-size: 19px; }
        .tab-btn span { font-size: 10px; font-weight: 700; text-align: center; }
        .tab-btn.active { 
            color: var(--accent-cyan); 
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5)); 
        }
        
        #global-entry-loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 17, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .spinner-ring {
            width: 55px;
            height: 55px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top: 3px solid var(--accent-cyan);
            border-right: 3px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
        }

        #ui-status-notifier {
            display: none; 
            padding: 12px 16px; 
            border-radius: 12px; 
            font-size: 13px; 
            position: fixed; 
            top: 70px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 10000; 
            text-align: center; 
            font-weight: 800;
            line-height: 1.4;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85); 
            width: 90%; 
            max-width: 420px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .status-error { 
            background: rgba(255, 20, 60, 0.98) !important; 
            border: 2px solid #ff4d6d !important; 
            color: #ffffff !important; 
            box-shadow: 0 0 30px rgba(255, 30, 70, 0.6) !important;
        }

        .status-info { 
            background: rgba(0, 240, 255, 0.98) !important; 
            border: 2px solid #70f4ff !important; 
            color: #050811 !important; 
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6) !important;
        }

        .status-success { 
            background: rgba(0, 230, 118, 0.98) !important; 
            border: 2px solid #69f0ae !important; 
            color: #050811 !important; 
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.6) !important;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- العنصر الخاص بترجمة جوجل المباشرة الخفي -->
    <div id="google_translate_element"></div>

    <div id="global-entry-loader">
        <div class="spinner-ring"></div>
        <p style="font-size:13px; color:#fff; font-weight:700;" id="loader-text" class="notranslate">PeetX Connecting Global System...</p>
    </div>

    <header>
        <div class="logo-box">
            <img src="favicon-32x32.png" alt="PeetX Logo" class="logo-icon">
            <span class="notranslate">PeetX</span>
        </div>
        <div class="header-actions">
            <div class="lang-selector-container">
                <button class="globe-icon-btn" id="country-flag-btn" onclick="toggleFlagMenu()">
                    <span id="flag-placeholder"><img src="https://flagcdn.com/w40/us.png" alt="US" /></span>
                    <i class="fa-solid fa-chevron-down arrow-icon"></i>
                </button>

                <div class="flag-dropdown-panel" id="flag-dropdown">
                    <input type="text" class="flag-search-input notranslate" id="flag-search" placeholder="Search country / ابحث..." oninput="filterFlags()">
                    <div class="flag-list-scroll" id="flag-list"></div>
                </div>
            </div>
            
            <div class="wallet-menu-container" style="display: flex; gap: 4px; align-items: center;">
                <button class="btn-action-nav" id="btn-wallet-connect" onclick="handleWalletAction()">
                    <i class="fa-solid fa-wallet"></i> <span id="txt-wallet-btn" class="notranslate">Connect Wallet</span>
                </button>
                <button class="wallet-arrow-btn" id="btn-wallet-arrow" style="display: none;" onclick="handleWalletAction()">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <div class="wallet-dropdown-menu" id="wallet-dropdown">
                    <div class="wallet-info-text" id="txt-auto-connect-info">
                        Connection is automated for convenience
                    </div>
                    <button class="btn-dropdown-copy" onclick="copyWalletAddress()">
                        <i class="fa-regular fa-copy"></i>
                        <span id="txt-copy-wallet">Copy Address</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="ui-status-notifier"></div>

    <!-- SECTIONS -->
    <section class="page-section active" id="section-peetx">
        <iframe src="PeetX.html" class="content-frame" id="iframe-peetx" title="PeetX Main" onload="syncStateWithIframe(this)"></iframe>
    </section>

    <section class="page-section" id="section-trade">
        <iframe src="trading.html" class="content-frame" id="iframe-trade" title="PeetX Trade" onload="syncStateWithIframe(this)"></iframe>
    </section>

    <section class="page-section" id="section-team">
        <iframe src="team.html" class="content-frame" id="iframe-team" title="PeetX Team" onload="syncStateWithIframe(this)"></iframe>
    </section>

    <section class="page-section" id="section-invest">
        <iframe src="invest.html" class="content-frame" id="iframe-invest" title="PeetX Invest" onload="syncStateWithIframe(this)"></iframe>
    </section>

    <section class="page-section" id="section-dao">
        <iframe src="dao.html" class="content-frame" id="iframe-dao" title="PeetX DAO" onload="syncStateWithIframe(this)"></iframe>
    </section>

    <!-- NAVIGATION FOOTER -->
    <nav class="nav-bar-footer">
        <div class="tab-btn active" id="nav-item-peetx" onclick="switchTab('peetx')">
            <i class="fa-solid fa-cube"></i>
            <span id="txt-nav-project">Project</span>
        </div>
        <div class="tab-btn" id="nav-item-trade" onclick="switchTab('trade')">
            <i class="fa-solid fa-chart-line"></i>
            <span id="txt-nav-trade">Trade</span>
        </div>
        <div class="tab-btn" id="nav-item-team" onclick="switchTab('team')">
            <i class="fa-solid fa-users-viewfinder"></i>
            <span id="txt-nav-team">Team</span>
        </div>
        <div class="tab-btn" id="nav-item-invest" onclick="switchTab('invest')">
            <i class="fa-solid fa-vault"></i>
            <span id="txt-nav-invest">Invest</span>
        </div>
        <div class="tab-btn" id="nav-item-dao" onclick="switchTab('dao')">
            <i class="fa-solid fa-landmark"></i>
            <span id="txt-nav-dao" class="notranslate">DAO</span>
        </div>
    </nav>

        let rawMessages = {
            walletWarning: "Please enter Web3 browser like Trust Wallet or MetaMask for direct decentralized connection.",
            successConnect: "Wallet connected successfully!",
            copiedMsg: "Wallet address copied successfully!",
            autoConnectedMsg: "Wallet automatically connected.",
            networkError: "Please switch to BNB Smart Chain network.",
            txtAutoConnectInfo: "Connection is automated for convenience",
            txtCopyWallet: "Copy Address"
        };

        const BNB_CHAIN_ID = '0x38';

        document.addEventListener('DOMContentLoaded', async () => {
            buildFlagDropdownList();
            await loadSavedLanguage();
            initSmartWeb3AutoConnect();

            document.addEventListener('click', (e) => {
                const container = document.querySelector('.wallet-menu-container');
                if (container && !container.contains(e.target)) {
                    closeWalletMenu();
                }
                const langContainer = document.querySelector('.lang-selector-container');
                if (langContainer && !langContainer.contains(e.target)) {
                    closeFlagMenu();
                }
            });
        });

        function buildFlagDropdownList() {
            const listContainer = document.getElementById('flag-list');
            if(!listContainer) return;
            
            listContainer.innerHTML = '';
            COUNTRIES_LIST.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flag-item';
                div.setAttribute('data-name', item.name.toLowerCase());
                div.setAttribute('data-code', item.code.toLowerCase());
                div.onclick = () => selectCountryLanguage(item.code, item.lang);

                div.innerHTML = `
                    <img src="https://flagcdn.com/w40/${item.code.toLowerCase()}.png" alt="${item.code}">
                    <span>${item.name}</span>
                `;
                listContainer.appendChild(div);
            });
        }

        function toggleFlagMenu() {
            const dropdown = document.getElementById('flag-dropdown');
            const btn = document.getElementById('country-flag-btn');
            if (dropdown) dropdown.classList.toggle('show');
            if (btn) btn.classList.toggle('active');
        }

        function closeFlagMenu() {
            const dropdown = document.getElementById('flag-dropdown');
            const btn = document.getElementById('country-flag-btn');
            if (dropdown) dropdown.classList.remove('show');
            if (btn) btn.classList.remove('active');
        }

        function filterFlags() {
            const query = document.getElementById('flag-search').value.toLowerCase();
            const items = document.querySelectorAll('.flag-item');
            items.forEach(item => {
                const name = item.getAttribute('data-name');
                const code = item.getAttribute('data-code');
                if (name.includes(query) || code.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // تشغيل جوجل المباشر فورياً وتحديث ملفات تعريف الكوكيز المحفوظة
        function triggerGoogleTranslateEngine(langCode) {
            // حفظ كوكيز جوجل لضمان ثبات الترجمة
            document.cookie = "googtrans=/en/" + langCode + "; path=/; domain=" + window.location.hostname;
            document.cookie = "googtrans=/en/" + langCode + "; path=/;";

            const selectElem = document.querySelector('.goog-te-combo');
            if (selectElem) {
                selectElem.value = langCode;
                selectElem.dispatchEvent(new Event('change'));
            }
        }

        async function selectCountryLanguage(countryCode, langCode) {
            closeFlagMenu();
            sessionState.currentCountry = countryCode;
            sessionState.currentLang = langCode;

            localStorage.setItem('peetx_saved_lang', langCode);
            localStorage.setItem('peetx_saved_country', countryCode);

            updateCountryFlagUI(countryCode);
            applyOrientation(langCode);

            triggerGlobalDataFetchLoader(300);

            triggerGoogleTranslateEngine(langCode);

            broadcastToIframes({
                type: 'PEETX_TRANSLATE',
                lang: langCode,
                dir: rtlLanguages.includes(langCode) ? 'rtl' : 'ltr'
            });
        }

        function broadcastToIframes(messageData) {
            const iframes = document.querySelectorAll('iframe.content-frame');
            iframes.forEach(iframe => {
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage(messageData, '*');
                }
            });
        }

        function syncStateWithIframe(iframe) {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({
                    type: 'PEETX_SYNC_STATE',
                    walletConnected: sessionState.walletConnected,
                    walletAddress: sessionState.walletAddress,
                    lang: sessionState.currentLang,
                    dir: rtlLanguages.includes(sessionState.currentLang) ? 'rtl' : 'ltr'
                }, '*');
            }
        }

        async function loadSavedLanguage() {
            const savedLang = localStorage.getItem('peetx_saved_lang') || 'en';
            const savedCountry = localStorage.getItem('peetx_saved_country') || 'us';

            sessionState.currentLang = savedLang;
            sessionState.currentCountry = savedCountry;

            updateCountryFlagUI(savedCountry);
            applyOrientation(savedLang);

            if (savedLang !== 'en') {
                setTimeout(() => {
                    triggerGoogleTranslateEngine(savedLang);
                }, 400);
            }

            document.body.classList.add('app-ready');
            triggerGlobalDataFetchLoader(400);
        }

        function updateCountryFlagUI(code) {
            const flagPlaceholder = document.getElementById('flag-placeholder');
            if (flagPlaceholder && code) {
                const flagUrl = `https://flagcdn.com/w40/${code.toLowerCase()}.png`;
                flagPlaceholder.innerHTML = `<img src="${flagUrl}" alt="${code}" />`;
            }
        }

        function applyOrientation(lang) {
            const htmlRoot = document.getElementById('html-root');
            if (rtlLanguages.includes(lang)) {
                htmlRoot.setAttribute('dir', 'rtl');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
            }
            htmlRoot.setAttribute('lang', lang);
        }

        function triggerGlobalDataFetchLoader(durationMs = 600) {
            const loader = document.getElementById('global-entry-loader');
            if(!loader) return;
            loader.style.opacity = '1';
            loader.style.visibility = 'visible';

            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, durationMs);
        }

        function showInternalNotification(message, type = "error") {
            const notifier = document.getElementById('ui-status-notifier');
            if (!notifier) return;
            notifier.innerHTML = message;
            
            if (type === "success") {
                notifier.className = "status-success";
            } else if (type === "info") {
                notifier.className = "status-info";
            } else {
                notifier.className = "status-error";
            }

            notifier.style.display = "block";
            setTimeout(() => { notifier.style.display = "none"; }, 5000);
        }

        function initSmartWeb3AutoConnect() {
            if (typeof window.ethereum !== 'undefined') {
                autoConnectWallet();

                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts && accounts.length > 0) {
                        checkNetworkAndConnect();
                    } else {
                        resetWalletState();
                        autoConnectWallet();
                    }
                });

                window.ethereum.on('chainChanged', () => {
                    checkNetworkAndConnect();
                });
            } else {
                showInternalNotification(rawMessages.walletWarning, "error");
            }
        }

        async function ensureBnbNetwork() {
            if (typeof window.ethereum === 'undefined') return false;
            try {
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId === BNB_CHAIN_ID) {
                    return true;
                }
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: BNB_CHAIN_ID }]
                    });
                    return true;
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        try {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: BNB_CHAIN_ID,
                                    chainName: 'BNB Smart Chain',
                                    nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                    rpcUrls: ['https://bsc-dataseed.binance.org/'],
                                    blockExplorerUrls: ['https://bscscan.com/']
                                }]
                            });
                            return true;
                        } catch (addError) {
                            return false;
                        }
                    }
                    return false;
                }
            } catch (error) {
                return false;
            }
        }

        async function checkNetworkAndConnect() {
            const isBnb = await ensureBnbNetwork();
            if (!isBnb) {
                resetWalletState();
                showInternalNotification(rawMessages.networkError, "error");
                return false;
            }
            return true;
        }

        async function autoConnectWallet() {
            if (typeof window.ethereum === 'undefined') {
                showInternalNotification(rawMessages.walletWarning, "error");
                return;
            }

            const isBnb = await checkNetworkAndConnect();
            if (!isBnb) return;

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (accounts && accounts.length > 0) {
                    updateConnectedWalletState(accounts[0]);
                }
            } catch (error) {
                console.warn("Auto connect error:", error);
            }
        }

        function resetWalletState() {
            sessionState.walletConnected = false;
            sessionState.walletAddress = null;

            const connectBtn = document.getElementById('btn-wallet-connect');
            if (connectBtn) {
                connectBtn.innerHTML = `<i class="fa-solid fa-wallet"></i> <span id="txt-wallet-btn" class="notranslate">Connect Wallet</span>`;
                connectBtn.classList.remove('connected-wallet');
            }

            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (arrowBtn) arrowBtn.style.display = 'none';

            closeWalletMenu();

            broadcastToIframes({
                type: 'PEETX_WALLET_UPDATE',
                connected: false,
                address: null
            });
        }

        function updateConnectedWalletState(userAddress) {
            sessionState.walletConnected = true;
            sessionState.walletAddress = userAddress;

            const truncatedAddress = userAddress.substring(0, 4) + '...' + userAddress.substring(userAddress.length - 4);
            
            const connectBtn = document.getElementById('btn-wallet-connect');
            if (connectBtn) {
                connectBtn.innerHTML = `<i class="fa-solid fa-wallet"></i> <span class="notranslate">${truncatedAddress}</span>`;
                connectBtn.classList.add('connected-wallet');
            }

            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (arrowBtn) arrowBtn.style.display = 'flex';

            broadcastToIframes({
                type: 'PEETX_WALLET_UPDATE',
                connected: true,
                address: userAddress
            });
        }

        function toggleWalletMenu() {
            const dropdown = document.getElementById('wallet-dropdown');
            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (dropdown) dropdown.classList.toggle('show');
            if (arrowBtn) arrowBtn.classList.toggle('active');
        }

        function closeWalletMenu() {
            const dropdown = document.getElementById('wallet-dropdown');
            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (dropdown) dropdown.classList.remove('show');
            if (arrowBtn) arrowBtn.classList.remove('active');
        }

        function handleWalletAction() {
            if (sessionState.walletConnected && sessionState.walletAddress) {
                toggleWalletMenu();
            } else {
                if (typeof window.ethereum !== 'undefined') {
                    autoConnectWallet();
                } else {
                    showInternalNotification(rawMessages.walletWarning, "error");
                }
            }
        }

        function copyWalletAddress() {
            if (sessionState.walletAddress) {
                navigator.clipboard.writeText(sessionState.walletAddress).then(() => {
                    showInternalNotification(rawMessages.copiedMsg, "success");
                }).catch(() => {
                    const el = document.createElement('textarea');
                    el.value = sessionState.walletAddress;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showInternalNotification(rawMessages.copiedMsg, "success");
                });
            }
            closeWalletMenu();
        }

        function switchTab(targetTabId) {
            closeWalletMenu();
            closeFlagMenu();
            triggerGlobalDataFetchLoader(350);
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            const selectedSection = document.getElementById(`section-${targetTabId}`);
            if(selectedSection) selectedSection.classList.add('active');
            
            const selectedNavItem = document.getElementById(`nav-item-${targetTabId}`);
            if(selectedNavItem) selectedNavItem.classList.add('active');
        }
    </script>
