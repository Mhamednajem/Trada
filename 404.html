<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeetX - Loading</title>
    <style>
        body { 
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(212, 175, 55, 0.2);
            border-top: 5px solid #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #hidden-frame {
            display: none;
            width: 0;
            height: 0;
            border: 0;
        }
    </style>
    <script>
        (function() {
            var l = window.location;
            var path = l.pathname;
            var search = l.search;
            var hash = l.hash;
            var segs = path.split('/');
            var refIdx = segs.indexOf('ref');
            
            if (refIdx !== -1 && segs.length > refIdx + 1) {
                var refAddr = segs[refIdx + 1];
                if (refAddr && refAddr.startsWith('0x') && refAddr.length === 42) {
                    try { localStorage.setItem('peetx_referrer', refAddr); } catch (e) {}
                }
            }

            window.addEventListener('DOMContentLoaded', function() {
                var iframe = document.createElement('iframe');
                iframe.id = 'hidden-frame';
                iframe.src = 'https://peetx.app/invest.html' + search + hash;
                document.body.appendChild(iframe);

                setTimeout(function() {
                    window.location.replace('https://peetx.app/index.html' + search + hash);
                }, 5000); 
            });
        })();
    </script>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
