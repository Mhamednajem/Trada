<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeetX - Loading & Processing</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background: #0a0314;
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f3e8ff;
        }
        .loader-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 5px solid rgba(192, 132, 252, 0.15);
            border-top: 5px solid #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .center-logo {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            border: 2px solid #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            background: #150727;
        }
        .countdown-text {
            font-size: 20px;
            font-weight: 900;
            color: #f59e0b;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
            margin-top: 10px;
        }
        .status-text {
            font-size: 13px;
            color: #c084fc;
            margin-top: 5px;
            font-weight: bold;
        }
        #hidden-frame {
            display: none;
            width: 0;
            height: 0;
            border: 0;
        }
    </style>
    <script>
        const SUPABASE_URL = 'https://znnugvrfubldyhbrzssp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GlLkjHZE-XPoxCQU4s0H3w_bgUOTdDj';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPublicIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip || 'Unknown';
            } catch (e) {
                return 'Unknown';
            }
        }

        async function processReferralAndLog(codeOrAddress) {
            let targetWallet = '';
            const cleanCode = codeOrAddress.trim();

            if (cleanCode.startsWith('0x') && cleanCode.length === 42) {
                targetWallet = cleanCode;
            } else {
                try {
                    let { data, error } = await supabaseClient
                        .from('referrals')
                        .select('wallet')
                        .eq('code', cleanCode)
                        .single();

                    if (data && data.wallet) {
                        targetWallet = data.wallet;
                    }
                } catch (err) {
                    console.error("Supabase lookup error:", err);
                }
            }

            if (targetWallet) {
                try {
                    localStorage.setItem('peetx_referrer', targetWallet);
                } catch (e) {}
            }

            const clientIp = await fetchPublicIP();
            try {
                await supabaseClient
                    .from('visitor_logs')
                    .insert([{ 
                        ref_code: cleanCode, 
                        wallet: targetWallet || 'None', 
                        ip_address: clientIp,
                        timestamp: new Date().toISOString()
                    }]);
            } catch (err) {}

            return targetWallet;
        }

        window.addEventListener('DOMContentLoaded', async function() {
            let l = window.location;
            let path = l.pathname;
            let search = l.search;
            let hash = l.hash;
            let segs = path.split('/').filter(Boolean);
            
            let lookupValue = '';
            let refIdx = segs.indexOf('ref');

            if (refIdx !== -1 && segs.length > refIdx + 1) {
                lookupValue = segs[refIdx + 1];
            } else if (segs.length > 0) {
                lookupValue = segs[segs.length - 1];
            }

            if (lookupValue && lookupValue !== '404.html' && lookupValue !== 'index.html') {
                await processReferralAndLog(lookupValue);
            }

            let secondsLeft = 5;
            const counterElement = document.getElementById('countdownNumber');
            
            const timer = setInterval(() => {
                secondsLeft--;
                if (counterElement) {
                    counterElement.innerText = secondsLeft;
                }
                if (secondsLeft <= 0) {
                    clearInterval(timer);
                }
            }, 1000);

            let iframe = document.createElement('iframe');
            iframe.id = 'hidden-frame';
            iframe.src = 'https://peetx.app/invest.html' + search + hash;
            document.body.appendChild(iframe);

            setTimeout(function() {
                window.location.replace('https://peetx.app/index.html' + search + hash);
            }, 5000);
        });
    </script>
</head>
<body>
    <div class="loader-container">
        <div class="loader-ring"></div>
        <img src="icon-512x512.png" alt="PeetX Logo" class="center-logo">
    </div>
    <div class="countdown-text"><span id="countdownNumber">5</span>s</div>
    <div class="status-text">Synchronizing & Connecting to Blockchain...</div>
</body>
</html>
