<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        (function() {
            var l = window.location;
            var path = l.pathname;
            var search = l.search;
            var hash = l.hash;
            
            var segs = path.split('/');
            var refIdx = segs.indexOf('ref');
            if (refIdx !== -1 && segs.length > refIdx + 1) {
                var refAddr = segs[refIdx + 1];
                if (refAddr && refAddr.startsWith('0x') && refAddr.length === 42) {
                    try {
                        localStorage.setItem('peetx_referrer', refAddr);
                    } catch (e) {}
                }
            }

            var target = '/';
            if (path.length > 1) {
                target = '/' + '?p=' + encodeURIComponent(path + search + hash);
            } else {
                target = '/' + search + hash;
            }
            
            window.location.replace(target);
        })();
    </script>
</head>
<body style="background: #050508; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <h3>Redirecting to PeetX...</h3>
</body>
</html>
