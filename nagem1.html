<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mining Department</title>
  <style>
    :root {
      --bg-color: #0b0612;
      --card-bg: rgba(25, 12, 38, 0.85);
      --purple-primary: #8a2be2;
      --purple-glow: #a855f7;
      --gold-primary: #ffd700;
      --gold-glow: #ffae00;
      --text-color: #f3e8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e0933 0%, var(--bg-color) 100%);
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      overflow: hidden;
    }

    .fullscreen-card {
      width: 100vw;
      height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: inset 0 0 100px rgba(138, 43, 226, 0.2);
    }

    .main-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--gold-primary);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .header-text {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--purple-glow);
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
      margin-bottom: 35px;
      text-transform: uppercase;
      max-width: 850px;
      line-height: 1.6;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .progress-wrapper {
      width: 85%;
      max-width: 800px;
    }

    .top-timer-container {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .timer-display {
      font-family: monospace;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--gold-primary);
      text-shadow: 0 0 15px var(--gold-glow);
      letter-spacing: 3px;
    }

    .progress-container {
      position: relative;
      width: 100%;
      height: 55px;
      background: rgba(15, 5, 25, 0.9);
      border-radius: 30px;
      border: 2px solid var(--purple-primary);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(138, 43, 226, 0.3);
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple-primary) 0%, var(--gold-primary) 100%);
      border-radius: 25px;
      box-shadow: 0 0 20px var(--gold-glow);
      transition: width 0.4s ease;
    }

    .progress-info {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 30px;
      font-weight: bold;
      font-size: 1.2rem;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .progress-center-text {
      color: #ffffff;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 1.1rem;
    }

    .percentage {
      position: absolute;
      right: 30px;
      color: var(--gold-primary);
    }

    .status-message {
      font-size: 1.2rem;
      color: var(--purple-glow);
      font-weight: 600;
      letter-spacing: 1px;
      min-height: 30px;
    }
  </style>
</head>
<body>

  <div class="fullscreen-card">
    <div class="main-title">MINING DEPARTMENT</div>
    
    <div class="header-text">
      ADDED NFT VERIFICATION FOR WALLET &amp; FUTURE RIGHTS AUTHENTICATION.<br>
      SWAP FEATURE &amp; FURTHER ENHANCEMENTS IMPLEMENTED.
    </div>

    <div class="progress-wrapper">
      <div class="top-timer-container">
        <div class="timer-display" id="timer">00:30:00</div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-info">
          <span class="progress-center-text">PROCESSING... PUBLISHING &amp; ADDING</span>
          <span class="percentage" id="percentage">0%</span>
        </div>
      </div>
    </div>

    <div class="status-message" id="statusMessage">Processing data...</div>
  </div>

  <script>
    const START_DATE = "2026-10-25";
    const START_TIME = "13:00:00";

    const DURATION_MINUTES = 30;
    const TOTAL_DURATION_MS = DURATION_MINUTES * 60 * 1000;

    const startTime = new Date(`${START_DATE}T${START_TIME}`).getTime();

    const progressBar = document.getElementById('progressBar');
    const percentageText = document.getElementById('percentage');
    const timerText = document.getElementById('timer');
    const statusMessage = document.getElementById('statusMessage');

    function updateProgress() {
      const now = Date.now();
      const elapsedTime = now - startTime;
      let progressPercent = (elapsedTime / TOTAL_DURATION_MS) * 100;

      if (progressPercent < 0) progressPercent = 0;

      if (progressPercent >= 100) {
        progressBar.style.width = '100%';
        percentageText.innerText = '100%';
        timerText.innerText = '00:00:00';
        statusMessage.innerText = 'PUBLISHED & READY!';
        statusMessage.style.color = '#ffd700';
        return;
      }

      const remainingTimeMs = TOTAL_DURATION_MS - elapsedTime;
      const totalSecondsLeft = Math.floor(remainingTimeMs / 1000);
      const hours = Math.floor(totalSecondsLeft / 3600);
      const minutes = Math.floor((totalSecondsLeft % 3600) / 60);
      const seconds = totalSecondsLeft % 60;

      const formattedTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      const currentPercent = Math.min(Math.floor(progressPercent), 99);

      progressBar.style.width = `${progressPercent}%`;
      percentageText.innerText = `${currentPercent}%`;
      timerText.innerText = formattedTime;

      requestAnimationFrame(updateProgress);
    }

    updateProgress();
  </script>
</body>
</html>
