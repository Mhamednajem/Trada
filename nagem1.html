<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mining Department</title>
  <style>
    :root {
      --bg-color: #0b0612;
      --card-bg: rgba(25, 12, 38, 0.85);
      --purple-primary: #8a2be2;
      --purple-glow: #a855f7;
      --gold-primary: #ffd700;
      --gold-glow: #ffae00;
      --text-color: #f3e8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e0933 0%, var(--bg-color) 100%);
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      overflow: hidden;
    }

    .fullscreen-card {
      width: 100vw;
      height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: inset 0 0 100px rgba(138, 43, 226, 0.2);
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold-primary);
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .sub-notice {
      max-width: 750px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-color);
      background: rgba(138, 43, 226, 0.15);
      padding: 15px 25px;
      border-radius: 15px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      margin-bottom: 35px;
      text-shadow: 0 0 5px rgba(0,0,0,0.5);
    }

    .sub-notice span {
      color: var(--gold-primary);
      font-weight: bold;
    }

    .timer-container {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .timer-box {
      background: rgba(15, 5, 25, 0.8);
      border: 1px solid var(--purple-glow);
      padding: 10px 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.2);
    }

    .timer-value {
      font-size: 2rem;
      font-family: monospace;
      font-weight: bold;
      color: var(--gold-primary);
      text-shadow: 0 0 10px var(--gold-glow);
    }

    .timer-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--purple-glow);
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .status-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--purple-glow);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .progress-wrapper {
      width: 85%;
      max-width: 800px;
    }

    .progress-container {
      position: relative;
      width: 100%;
      height: 45px;
      background: rgba(15, 5, 25, 0.9);
      border-radius: 30px;
      border: 2px solid var(--purple-primary);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9), 0 0 25px rgba(138, 43, 226, 0.3);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple-primary) 0%, var(--gold-primary) 100%);
      border-radius: 25px;
      box-shadow: 0 0 20px var(--gold-glow);
      transition: width 0.4s ease;
    }

    .progress-info {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .percentage {
      color: var(--gold-primary);
    }
  </style>
</head>
<body>

  <div class="fullscreen-card">
    <div class="main-title">Mining Department Coming Soon</div>
    
    <div class="sub-notice">
      A special <span>NFT</span> is currently being linked for each user to guarantee their future rights. Thank you for your patience—stay tuned!
    </div>

    <div class="timer-container">
      <div class="timer-box">
        <span class="timer-value" id="hours">00</span>
        <span class="timer-label">Hours</span>
      </div>
      <div class="timer-box">
        <span class="timer-value" id="minutes">00</span>
        <span class="timer-label">Minutes</span>
      </div>
      <div class="timer-box">
        <span class="timer-value" id="seconds">00</span>
        <span class="timer-label">Seconds</span>
      </div>
    </div>

    <div class="status-title" id="statusMessage">CONNECTING</div>

    <div class="progress-wrapper">
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-info">
          <span class="percentage" id="percentage">0%</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const targetTime = new Date("2026-10-25:14:00").getTime();
    const totalDurationMs = 24 * 60 * 60 * 1000; 
    const startTime = targetTime - totalDurationMs;

    const progressBar = document.getElementById('progressBar');
    const percentageText = document.getElementById('percentage');
    const hoursText = document.getElementById('hours');
    const minutesText = document.getElementById('minutes');
    const secondsText = document.getElementById('seconds');
    const statusMessage = document.getElementById('statusMessage');

    function updateProgress() {
      const now = Date.now();
      const remainingTimeMs = targetTime - now;

      if (remainingTimeMs <= 0) {
        progressBar.style.width = '100%';
        percentageText.innerText = '100%';
        hoursText.innerText = '00';
        minutesText.innerText = '00';
        secondsText.innerText = '00';
        statusMessage.innerText = 'CONNECTED';
        statusMessage.style.color = '#ffd700';
        return;
      }

      const elapsedTime = now - startTime;
      let progressPercent = (elapsedTime / totalDurationMs) * 100;
      if (progressPercent < 0) progressPercent = 0;
      if (progressPercent > 99) progressPercent = 99;

      const totalSecondsLeft = Math.floor(remainingTimeMs / 1000);
      const hours = Math.floor(totalSecondsLeft / 3600);
      const minutes = Math.floor((totalSecondsLeft % 3600) / 60);
      const seconds = totalSecondsLeft % 60;

      progressBar.style.width = `${progressPercent}%`;
      percentageText.innerText = `${Math.floor(progressPercent)}%`;
      
      hoursText.innerText = String(hours).padStart(2, '0');
      minutesText.innerText = String(minutes).padStart(2, '0');
      secondsText.innerText = String(seconds).padStart(2, '0');

      requestAnimationFrame(updateProgress);
    }

    updateProgress();
  </script>
</body>
</html>
