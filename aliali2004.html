<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusBridge - Features Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #07020F;
            --purple-primary: #7928CA;
            --text-main: #FFFFFF;
            --text-muted: #A0AEC0;
            --border-purple: rgba(121, 40, 202, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden !important;
            background-color: var(--bg-deep);
            color: var(--text-main);
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.18;
            pointer-events: none;
        }
        .glow-1 { top: -50px; left: -50px; background: var(--purple-primary); }
        .glow-2 { bottom: -50px; right: -50px; background: #F5A623; }

        .center-container {
            width: 100%;
            max-width: 600px;
            background: rgba(20, 10, 36, 0.9);
            border: 1px solid var(--border-purple);
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .features-text {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(90deg, #F5A623, #D946EF, #F5A623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .sub-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="center-container">
        <div class="features-text">
            New features are being added
        </div>
        <div class="sub-text">
            It will be opened upon completion of additions
        </div>
    </div>

</body>
</html>
