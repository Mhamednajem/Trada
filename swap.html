<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeetX Swap</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-purple: #1a0b2e;
            --card-purple: #281245;
            --input-purple: #160826;
            --gold: #f3ba2f;
            --gold-hover: #d4a022;
            --text-color: #ffffff;
            --text-dim: #a092b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-purple);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .swap-container {
            background: var(--card-purple);
            border: 2px solid var(--gold);
            border-radius: 20px;
            width: 400px;
            padding: 24px;
            box-shadow: 0 0 25px rgba(243, 186, 47, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            color: var(--gold);
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(243, 186, 47, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3333;
        }

        .status-dot.active {
            background: #00ff88;
        }

        .box {
            background: var(--input-purple);
            border: 1px solid rgba(243, 186, 47, 0.3);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 8px;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .box-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            width: 55%;
            outline: none;
            font-weight: bold;
        }

        select {
            background: var(--card-purple);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 14px;
            border-radius: 12px;
            outline: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .switch-btn-container {
            display: flex;
            justify-content: center;
            margin: -16px 0;
            position: relative;
            z-index: 2;
        }

        .switch-btn {
            background: var(--gold);
            border: 4px solid var(--card-purple);
            color: var(--bg-purple);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .switch-btn:hover {
            transform: rotate(180deg);
        }

        .info-panel {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(243, 186, 47, 0.15);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-dim);
        }

        .timer-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-color);
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 28px;
            height: 28px;
        }

        .timer-svg circle {
            fill: none;
            stroke-width: 3;
        }

        .timer-bg {
            stroke: rgba(243, 186, 47, 0.2);
        }

        .timer-progress {
            stroke: var(--gold);
            stroke-dasharray: 75;
            stroke-dashoffset: 0;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }

        .timer-text {
            font-weight: bold;
            color: var(--gold);
        }

        .action-btn {
            width: 100%;
            background: var(--gold);
            color: var(--bg-purple);
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.2);
        }

        .action-btn:hover {
            background: var(--gold-hover);
        }
    </style>
</head>
<body>

<div class="swap-container">
    <div class="header">
        <div class="title">PeetX</div>
        <div class="status-badge" id="walletStatus" onclick="initWallet()">
            <span class="status-dot" id="statusDot"></span>
            <span id="accountText">جاري الاتصال...</span>
        </div>
    </div>

    <div class="box">
        <div class="box-header">
            <span>من</span>
            <span>الرصيد: <span id="fromBalance">0.0</span></span>
        </div>
        <div class="box-body">
            <input type="number" id="fromAmount" placeholder="0.0" oninput="calculateSwap()">
            <select id="fromToken" onchange="handleTokenChange()">
                <option value="BNB">BNB</option>
                <option value="USDC">USDC</option>
            </select>
        </div>
    </div>

    <div class="switch-btn-container">
        <button class="switch-btn" onclick="switchTokens()">↓↑</button>
    </div>

    <div class="box">
        <div class="box-header">
            <span>إلى</span>
            <span>الرصيد: <span id="toBalance">0.0</span></span>
        </div>
        <div class="box-body">
            <input type="number" id="toAmount" placeholder="0.0" readonly>
            <select id="toToken" disabled>
                <option value="USDT">USDT</option>
            </select>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-row">
            <span>الانزلاق المسموح:</span>
            <span style="color: var(--gold); font-weight: bold;">تلقائي (أرخص انزلاق)</span>
        </div>
        <div class="info-row">
            <span>تحديث الأسعار:</span>
            <div class="timer-wrapper">
                <svg class="timer-svg" viewBox="0 0 28 28">
                    <circle class="timer-bg" cx="14" cy="14" r="12"></circle>
                    <circle class="timer-progress" id="timerCircle" cx="14" cy="14" r="12"></circle>
                </svg>
                <span class="timer-text"><span id="timerText">9</span> ثواني</span>
            </div>
        </div>
    </div>

    <button class="action-btn" id="swapBtn" onclick="executeSwap()">تبادل</button>
</div>

<script>
    const TOKENS = {
        BNB: { address: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c", decimals: 18 },
        USDC: { address: "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", decimals: 18 },
        USDT: { address: "0x55d398326f99059fF775485246999027B3197955", decimals: 18 }
    };

    const PANCAKE_ROUTER_ADDRESS = "0x10ED43C718714eb63d5aA57B78B54704E256024E";
    const BSC_RPC = "https://bsc-dataseed1.binance.org/";

    const ERC20_ABI = ["function balanceOf(address owner) view returns (uint256)"];
    const ROUTER_ABI = ["function getAmountsOut(uint amountIn, address[] memory path) public view returns (uint[] memory amounts)"];

    let provider, publicProvider, signer, userAddress;
    let countdown = 9;
    const circleMaxOffset = 75;

    async function initWallet() {
        publicProvider = new ethers.providers.JsonRpcProvider(BSC_RPC);

        if (window.ethereum) {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                
                // Force BSC Network (Chain ID 56)
                const network = await provider.getNetwork();
                if (network.chainId !== 56) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x38' }]
                        });
                    } catch (e) {}
                }

                const accounts = await provider.send("eth_requestAccounts", []);
                if (accounts.length > 0) {
                    userAddress = accounts[0];
                    signer = provider.getSigner();
                    
                    let shortAddr = userAddress.substring(0, 4) + "..." + userAddress.substring(userAddress.length - 4);
                    document.getElementById('accountText').innerText = shortAddr;
                    document.getElementById('statusDot').classList.add('active');
                    
                    updateBalances();
                    calculateSwap();
                }
            } catch (err) {
                console.error("Wallet Connection Error:", err);
                document.getElementById('accountText').innerText = "اضغط للاتصال";
            }
        } else {
            document.getElementById('accountText').innerText = "افتح بمحفظة DApp";
        }
    }

    window.addEventListener('load', () => {
        initWallet();
        setTimeout(initWallet, 1000);
    });

    setInterval(() => {
        countdown--;
        if (countdown < 0) {
            countdown = 9;
            calculateSwap();
        }
        document.getElementById('timerText').innerText = countdown;
        const offset = circleMaxOffset - (circleMaxOffset * countdown / 9);
        document.getElementById('timerCircle').style.strokeDashoffset = offset;
    }, 1000);

    async function updateBalances() {
        if (!userAddress) return;

        const fromToken = document.getElementById('fromToken').value;
        const toToken = document.getElementById('toToken').value;

        document.getElementById('fromBalance').innerText = await getBalance(fromToken);
        document.getElementById('toBalance').innerText = await getBalance(toToken);
    }

    async function getBalance(symbol) {
        if (!userAddress) return "0.0";
        try {
            const activeProvider = provider || publicProvider;
            if (symbol === "BNB") {
                const bal = await activeProvider.getBalance(userAddress);
                return parseFloat(ethers.utils.formatEther(bal)).toFixed(4);
            } else {
                const contract = new ethers.Contract(TOKENS[symbol].address, ERC20_ABI, activeProvider);
                const bal = await contract.balanceOf(userAddress);
                return parseFloat(ethers.utils.formatUnits(bal, TOKENS[symbol].decimals)).toFixed(2);
            }
        } catch (e) {
            console.error("Balance Error:", e);
            return "0.0";
        }
    }

    function switchTokens() {
        const fromSelect = document.getElementById('fromToken');
        fromSelect.value = fromSelect.value === "BNB" ? "USDC" : "BNB";
        updateBalances();
        calculateSwap();
    }

    function handleTokenChange() {
        updateBalances();
        calculateSwap();
    }

    async function calculateSwap() {
        const amount = document.getElementById('fromAmount').value;
        if (!amount || amount <= 0) {
            document.getElementById('toAmount').value = "";
            return;
        }

        try {
            const fromSymbol = document.getElementById('fromToken').value;
            const toSymbol = document.getElementById('toToken').value;

            const fromAddress = TOKENS[fromSymbol].address;
            const toAddress = TOKENS[toSymbol].address;

            const activeProvider = publicProvider || provider;
            const routerContract = new ethers.Contract(PANCAKE_ROUTER_ADDRESS, ROUTER_ABI, activeProvider);
            const parsedAmount = ethers.utils.parseUnits(amount, TOKENS[fromSymbol].decimals);

            const amounts = await routerContract.getAmountsOut(parsedAmount, [fromAddress, toAddress]);
            const outputAmount = ethers.utils.formatUnits(amounts[1], TOKENS[toSymbol].decimals);

            document.getElementById('toAmount').value = parseFloat(outputAmount).toFixed(4);
        } catch (e) {
            console.error("Price Fetch Error:", e);
        }
    }

    function executeSwap() {
        if (!userAddress) {
            initWallet();
            return;
        }
        alert("جاري تنفيذ التبادل بأقل انزلاق تلقائي عبر PancakeSwap Router...");
    }
</script>

</body>
</html>
