<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Platform - Launching Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b12;
      --card-bg: rgba(13, 20, 36, 0.85);
      --accent-green: #00e676;
      --accent-blue: #00b0ff;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border-glow: rgba(0, 230, 118, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      position: relative;
    }

    /* Fullscreen Trading Grid Background */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 60px 60px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      z-index: 0;
    }

    /* Glow Effects */
    .glow-1 {
      position: absolute;
      top: 15%;
      left: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 230, 118, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .glow-2 {
      position: absolute;
      bottom: 15%;
      right: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 176, 255, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Fullscreen Container Card */
    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 750px;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8),
                  0 0 40px rgba(0, 230, 118, 0.05);
    }

    /* Trading Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 22px;
      background: rgba(0, 230, 118, 0.08);
      border: 1px solid var(--accent-green);
      border-radius: 50px;
      color: var(--accent-green);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 0%, #00e676 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-bottom: 45px;
      line-height: 1.6;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Countdown Grid */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: nowrap;
    }

    .time-box {
      background: rgba(6, 11, 21, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 22px 15px;
      flex: 1;
      min-width: 90px;
      max-width: 130px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
      position: relative;
      overflow: hidden;
    }

    .time-box::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
    }

    .number {
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffffff;
      display: block;
      line-height: 1;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .label {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .container { padding: 40px 20px; }
      h1 { font-size: 1.9rem; }
      p.subtitle { font-size: 0.95rem; margin-bottom: 30px; }
      .countdown { gap: 10px; }
      .time-box { padding: 15px 8px; min-width: 70px; }
      .number { font-size: 1.8rem; }
      .label { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Grid Background and Glows -->
  <div class="bg-grid"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Main Trading Card -->
  <div class="container">
    <div class="badge">
      <span class="badge-dot"></span>
      Trading Department
    </div>

    <h1>Trading Platform Launching Soon</h1>
    <p class="subtitle">We are building a high-performance trading platform designed for real-time market access and seamless execution.</p>

    <!-- Global Unified Countdown Grid -->
    <div class="countdown">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>
  </div>

  <script>
    // FIXED GLOBAL LAUNCH DATE: October 26, 2026 at 01:00:00 UTC
    // Calculated live based on the user's current entry time relative to UTC target
    const launchDate = new Date("2026-10-26T01:00:00Z").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = launchDate - now;

      if (difference <= 0) {
        document.getElementById('days').innerText = '00';
        document.getElementById('hours').innerText = '00';
        document.getElementById('minutes').innerText = '00';
        document.getElementById('seconds').innerText = '00';
        document.querySelector('h1').innerText = 'Trading Department Live!';
        document.querySelector('.badge').innerHTML = '<span class="badge-dot"></span> Available Now';
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').innerText = String(days).padStart(2, '0');
      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
