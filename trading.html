    <link rel="apple-touch-icon" sizes="512x512" href="icon-512x512.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>

    <style>
        :root {
            --bg-main: #050811;
            --bg-card: rgba(13, 19, 33, 0.85);
            --border-color: rgba(0, 240, 255, 0.12);
            --border-glow: rgba(0, 240, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-cyan: #00f0ff;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-green: #00ff88;
            --accent-red: #ff3b5c;
            --accent-gold: #ffd700;
            --primary-gradient: linear-gradient(135deg, #00f0ff 0%, #3b82f6 50%, #8b5cf6 100%);
        }

        body {
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow: hidden !important;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            position: relative;
            top: 0 !important;
        }

        body.app-ready {
            opacity: 1 !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background: rgba(8, 12, 24, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 1000;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
        }

        .logo-box { display: flex; align-items: center; gap: 8px; }
        .logo-box img.logo-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6));
        }
        .logo-box span { 
            font-weight: 800; 
            font-size: 18px; 
            letter-spacing: 1px; 
            background: var(--primary-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        
        .country-select-container {
            position: relative;
        }

        .globe-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            height: 38px;
            padding: 2px 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.1);
            gap: 2px;
        }

        .globe-icon-btn img {
            width: 22px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }

        .globe-icon-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .countries-dropdown-menu {
            display: none;
            position: absolute;
            top: 45px;
            background: rgba(8, 12, 24, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 8px;
            width: 270px;
            max-height: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            z-index: 1002;
            flex-direction: column;
            gap: 6px;
            animation: fadeIn 0.2s ease-in-out;
        }

        html[dir="rtl"] .countries-dropdown-menu { right: 0; left: auto; }
        html[dir="ltr"] .countries-dropdown-menu { left: 0; right: auto; }

        .countries-dropdown-menu.show { display: flex; }

        .country-search-box {
            width: 100%;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
        }

        .countries-list {
            overflow-y: auto;
            max-height: 300px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .country-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 12px;
            color: var(--text-primary);
        }

        .country-item:hover {
            background: rgba(0, 240, 255, 0.15);
        }

        .country-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .country-item img {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
        }

        .country-code-badge {
            font-size: 10px;
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.1);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .btn-action-nav {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.12), rgba(59, 130, 246, 0.12));
            border: 1px solid var(--border-glow);
            color: var(--text-primary);
            padding: 6px 12px;
            height: 38px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-action-nav:hover { 
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: translateY(-1px);
        }
        
        .btn-action-nav.connected-wallet {
            border-color: var(--accent-green);
            color: #ffffff;
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.25);
        }

        .wallet-menu-container {
            position: relative;
        }

        .wallet-arrow-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .wallet-arrow-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .wallet-arrow-btn i {
            transition: transform 0.3s ease;
        }

        .wallet-arrow-btn.active i {
            transform: rotate(180deg);
        }

        .wallet-dropdown-menu {
            display: none;
            position: absolute;
            top: 45px;
            background: rgba(8, 12, 24, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px;
            width: 200px;
            max-width: calc(100vw - 28px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            z-index: 1001;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.2s ease-in-out;
        }

        html[dir="rtl"] .wallet-dropdown-menu { left: 0; right: auto; }
        html[dir="ltr"] .wallet-dropdown-menu { right: 0; left: auto; }

        .wallet-dropdown-menu.show { display: flex; }

        .wallet-info-text {
            font-size: 10px;
            color: var(--accent-cyan);
            font-weight: 700;
            line-height: 1.4;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            text-align: center;
            word-break: break-word;
        }

        .btn-dropdown-copy {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s ease;
            width: 100%;
        }

        .btn-dropdown-copy:hover {
            background: rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        
        .page-section { 
            display: none; 
            padding: 0; 
            margin: 0;
            width: 100vw;
            height: calc(100vh - 128px); 
            position: absolute;
            top: 60px;
            left: 0;
        }
        
        .page-section.active { display: block; }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            display: block;
            background: transparent;
        }

        .nav-bar-footer {
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(8, 12, 24, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color); 
            display: flex; height: 68px; z-index: 1000;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
        }

        .tab-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-secondary); cursor: pointer; gap: 4px; transition: all 0.25s ease;
        }

        .tab-btn i { font-size: 19px; }
        .tab-btn span { font-size: 10px; font-weight: 700; text-align: center; }
        .tab-btn.active { 
            color: var(--accent-cyan); 
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.5)); 
        }
        
        #global-entry-loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 17, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .spinner-ring {
            width: 55px;
            height: 55px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top: 3px solid var(--accent-cyan);
            border-right: 3px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
        }

        #ui-status-notifier {
            display: none; 
            padding: 12px 16px; 
            border-radius: 12px; 
            font-size: 13px; 
            position: fixed; 
            top: 70px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 10000; 
            text-align: center; 
            font-weight: 800;
            line-height: 1.4;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85); 
            width: 90%; 
            max-width: 420px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .status-error { 
            background: rgba(255, 20, 60, 0.98) !important; 
            border: 2px solid #ff4d6d !important; 
            color: #ffffff !important; 
            box-shadow: 0 0 30px rgba(255, 30, 70, 0.6) !important;
        }

        .status-info { 
            background: rgba(0, 240, 255, 0.98) !important; 
            border: 2px solid #70f4ff !important; 
            color: #050811 !important; 
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6) !important;
        }

        .status-success { 
            background: rgba(0, 230, 118, 0.98) !important; 
            border: 2px solid #69f0ae !important; 
            color: #050811 !important; 
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.6) !important;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="global-entry-loader">
        <div class="spinner-ring"></div>
        <p style="font-size:13px; color:#fff; font-weight:700;" id="loader-text">PeetX Connecting Global System...</p>
    </div>

    <header>
        <div class="logo-box">
            <img src="favicon-32x32.png" alt="PeetX Logo" class="logo-icon">
            <span class="no-translate">PeetX</span>
        </div>
        <div class="header-actions">
            
            <div class="country-select-container">
                <button class="globe-icon-btn" id="country-flag-btn" onclick="toggleCountryMenu()">
                    <span id="flag-container"><i class="fa-solid fa-globe"></i></span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 8px;"></i>
                </button>

                <div class="countries-dropdown-menu" id="countries-dropdown">
                    <input type="text" class="country-search-box" id="country-search" placeholder="Search country..." oninput="filterCountries()">
                    <div class="countries-list" id="countries-list"></div>
                </div>
            </div>

            <div class="wallet-menu-container" style="display: flex; gap: 4px; align-items: center;">
                <button class="btn-action-nav" id="btn-wallet-connect" onclick="handleWalletAction()">
                    <i class="fa-solid fa-wallet"></i> <span id="txt-wallet-btn" data-key="connect_wallet">ربط المحفظة</span>
                </button>
                <button class="wallet-arrow-btn" id="btn-wallet-arrow" style="display: none;" onclick="handleWalletAction()">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>

                <div class="wallet-dropdown-menu" id="wallet-dropdown">
                    <div class="wallet-info-text" id="txt-auto-connect-info" data-key="auto_connect_info">
                        الاتصال يتم تلقائي للتسهيل على مستخدمنا العزيز
                    </div>
                    <button class="btn-dropdown-copy" onclick="copyWalletAddress()">
                        <i class="fa-regular fa-copy"></i>
                        <span id="txt-copy-wallet" data-key="copy_wallet">نسخ المحفظه</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div id="ui-status-notifier"></div>

    <section class="page-section active" id="section-peetx">
        <iframe src="peetx.html" class="content-frame" id="iframe-peetx" title="PeetX Main"></iframe>
    </section>

    <section class="page-section" id="section-trade">
        <iframe src="trade.html" class="content-frame" id="iframe-trade" title="PeetX Trade"></iframe>
    </section>

    <section class="page-section" id="section-team">
        <iframe src="team.html" class="content-frame" id="iframe-team" title="PeetX Team"></iframe>
    </section>

    <section class="page-section" id="section-invest">
        <iframe src="invest.html" class="content-frame" id="iframe-invest" title="PeetX Invest"></iframe>
    </section>

    <section class="page-section" id="section-dao">
        <iframe src="dao.html" class="content-frame" id="iframe-dao" title="PeetX DAO"></iframe>
    </section>

    <nav class="nav-bar-footer">
        <div class="tab-btn active" id="nav-item-peetx" onclick="switchTab('peetx')">
            <i class="fa-solid fa-cube"></i>
            <span id="txt-nav-project" data-key="nav_project">المشروع</span>
        </div>
        <div class="tab-btn" id="nav-item-trade" onclick="switchTab('trade')">
            <i class="fa-solid fa-chart-line"></i>
            <span id="txt-nav-trade" data-key="nav_trade">التداول</span>
        </div>
        <div class="tab-btn" id="nav-item-team" onclick="switchTab('team')">
            <i class="fa-solid fa-users-viewfinder"></i>
            <span id="txt-nav-team" data-key="nav_team">الفريق</span>
        </div>
        <div class="tab-btn" id="nav-item-invest" onclick="switchTab('invest')">
            <i class="fa-solid fa-vault"></i>
            <span id="txt-nav-invest" data-key="nav_invest">الاستثمار</span>
        </div>
        <div class="tab-btn" id="nav-item-dao" onclick="switchTab('dao')">
            <i class="fa-solid fa-landmark"></i>
            <span id="txt-nav-dao" data-key="nav_dao">منظمة DAO</span>
        </div>
    </nav>

            renderCountriesList(filtered);
        }

        function selectCountry(code, lang, userAction = true) {
            sessionState.currentCountry = code;
            sessionState.currentLang = lang;

            localStorage.setItem('px_lang', lang);
            localStorage.setItem('px_country', code);

            const flagContainer = document.getElementById('flag-container');
            if(flagContainer) {
                flagContainer.innerHTML = `<img src="https://flagcdn.com/w40/${code.toLowerCase()}.png" alt="${code}" />`;
            }

            applyInternalTranslation(lang);
            broadcastStateToAllIframes();
            if(userAction) reloadActiveIframe();
        }

        function applyInternalTranslation(lang) {
            const dictionary = LOCAL_TRANSLATIONS[lang] || LOCAL_TRANSLATIONS['en'];
            const htmlRoot = document.getElementById('html-root');

            if (rtlLanguages.includes(lang)) {
                htmlRoot.setAttribute('dir', 'rtl');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
            }
            htmlRoot.setAttribute('lang', lang);

            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (dictionary[key]) {
                    el.innerText = dictionary[key];
                }
            });
        }

        function broadcastStateToAllIframes() {
            const payload = {
                type: 'PEETX_SYNC_STATE',
                lang: sessionState.currentLang,
                country: sessionState.currentCountry,
                countryCode: sessionState.currentCountry,
                wallet: sessionState.walletAddress || '',
                connected: sessionState.walletConnected,
                timestamp: Date.now()
            };

            const iframes = document.querySelectorAll('.content-frame');
            iframes.forEach(iframe => {
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage(payload, '*');
                }
            });
        }

        function toggleCountryMenu() {
            const dropdown = document.getElementById('countries-dropdown');
            if(dropdown) dropdown.classList.toggle('show');
            closeWalletMenu();
        }

        function closeCountryMenu() {
            const dropdown = document.getElementById('countries-dropdown');
            if(dropdown) dropdown.classList.remove('show');
        }

        function reloadActiveIframe() {
            const activeSection = document.querySelector('.page-section.active');
            if(!activeSection) return;
            const iframe = activeSection.querySelector('iframe');
            if(!iframe) return;

            const baseUrl = iframe.src.split('?')[0];
            const walletParam = sessionState.walletAddress ? encodeURIComponent(sessionState.walletAddress) : '';
            const langParam = sessionState.currentLang;
            const countryParam = sessionState.currentCountry;

            iframe.src = `${baseUrl}?wallet=${walletParam}&lang=${langParam}&country=${countryParam}&countryCode=${countryParam}`;
        }

        function triggerGlobalDataFetchLoader(durationMs = 300) {
            const loader = document.getElementById('global-entry-loader');
            if(!loader) return;
            loader.style.opacity = '1';
            loader.style.visibility = 'visible';

            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
            }, durationMs);
        }

        function showInternalNotification(message, type = "error") {
            const notifier = document.getElementById('ui-status-notifier');
            if (!notifier) return;
            notifier.innerHTML = message;
            
            if (type === "success") notifier.className = "status-success";
            else if (type === "info") notifier.className = "status-info";
            else notifier.className = "status-error";

            notifier.style.display = "block";
            setTimeout(() => { notifier.style.display = "none"; }, 4000);
        }

        function initSmartWeb3AutoConnect() {
            if (typeof window.ethereum !== 'undefined') {
                autoConnectWallet();

                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts && accounts.length > 0) {
                        checkNetworkAndConnect();
                    } else {
                        resetWalletState();
                        autoConnectWallet();
                    }
                });

                window.ethereum.on('chainChanged', () => {
                    checkNetworkAndConnect();
                });
            } else {
                if(!sessionState.walletAddress) {
                    const dict = LOCAL_TRANSLATIONS[sessionState.currentLang] || LOCAL_TRANSLATIONS['en'];
                    showInternalNotification(dict.wallet_warning, "error");
                }
            }
        }

        async function ensureBnbNetwork() {
            if (typeof window.ethereum === 'undefined') return false;
            try {
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId === BNB_CHAIN_ID) return true;
                
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: BNB_CHAIN_ID }]
                    });
                    return true;
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        try {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: BNB_CHAIN_ID,
                                    chainName: 'BNB Smart Chain',
                                    nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                    rpcUrls: ['https://bsc-dataseed.binance.org/'],
                                    blockExplorerUrls: ['https://bscscan.com/']
                                }]
                            });
                            return true;
                        } catch (addError) {
                            return false;
                        }
                    }
                    return false;
                }
            } catch (error) {
                return false;
            }
        }

        async function checkNetworkAndConnect() {
            const isBnb = await ensureBnbNetwork();
            if (!isBnb) {
                resetWalletState();
                const dict = LOCAL_TRANSLATIONS[sessionState.currentLang] || LOCAL_TRANSLATIONS['en'];
                showInternalNotification(dict.network_error, "error");
                return false;
            }
            return true;
        }

        async function autoConnectWallet() {
            if (typeof window.ethereum === 'undefined') return;

            const isBnb = await checkNetworkAndConnect();
            if (!isBnb) return;

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                if (accounts && accounts.length > 0) {
                    updateConnectedWalletState(accounts[0]);
                }
            } catch (error) {
                console.warn("Auto connect error:", error);
            }
        }

        function resetWalletState() {
            sessionState.walletConnected = false;
            sessionState.walletAddress = null;
            localStorage.removeItem('px_wallet');

            const connectBtn = document.getElementById('btn-wallet-connect');
            if (connectBtn) {
                const dict = LOCAL_TRANSLATIONS[sessionState.currentLang] || LOCAL_TRANSLATIONS['en'];
                connectBtn.innerHTML = `<i class="fa-solid fa-wallet"></i> <span id="txt-wallet-btn">${dict.connect_wallet}</span>`;
                connectBtn.classList.remove('connected-wallet');
            }

            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (arrowBtn) arrowBtn.style.display = 'none';

            closeWalletMenu();
            broadcastStateToAllIframes();
        }

        function updateConnectedWalletState(userAddress) {
            sessionState.walletConnected = true;
            sessionState.walletAddress = userAddress;
            localStorage.setItem('px_wallet', userAddress);

            const truncatedAddress = userAddress.substring(0, 4) + '...' + userAddress.substring(userAddress.length - 4);
            
            const connectBtn = document.getElementById('btn-wallet-connect');
            if (connectBtn) {
                connectBtn.innerHTML = `<i class="fa-solid fa-wallet"></i> <span>${truncatedAddress}</span>`;
                connectBtn.classList.add('connected-wallet');
            }

            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (arrowBtn) arrowBtn.style.display = 'flex';

            broadcastStateToAllIframes();
        }

        function toggleWalletMenu() {
            const dropdown = document.getElementById('wallet-dropdown');
            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (dropdown) dropdown.classList.toggle('show');
            if (arrowBtn) arrowBtn.classList.toggle('active');
            closeCountryMenu();
        }

        function closeWalletMenu() {
            const dropdown = document.getElementById('wallet-dropdown');
            const arrowBtn = document.getElementById('btn-wallet-arrow');
            if (dropdown) dropdown.classList.remove('show');
            if (arrowBtn) arrowBtn.classList.remove('active');
        }

        function handleWalletAction() {
            if (sessionState.walletConnected && sessionState.walletAddress) {
                toggleWalletMenu();
            } else {
                if (typeof window.ethereum !== 'undefined') {
                    autoConnectWallet();
                } else {
                    const dict = LOCAL_TRANSLATIONS[sessionState.currentLang] || LOCAL_TRANSLATIONS['en'];
                    showInternalNotification(dict.wallet_warning, "error");
                }
            }
        }

        function copyWalletAddress() {
            const dict = LOCAL_TRANSLATIONS[sessionState.currentLang] || LOCAL_TRANSLATIONS['en'];
            if (sessionState.walletAddress) {
                navigator.clipboard.writeText(sessionState.walletAddress).then(() => {
                    showInternalNotification(dict.copied_msg, "success");
                }).catch(() => {
                    const el = document.createElement('textarea');
                    el.value = sessionState.walletAddress;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    showInternalNotification(dict.copied_msg, "success");
                });
            }
            closeWalletMenu();
        }

        function switchTab(targetTabId) {
            closeWalletMenu();
            closeCountryMenu();
            triggerGlobalDataFetchLoader(200);
            
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            const selectedSection = document.getElementById(`section-${targetTabId}`);
            if(selectedSection) selectedSection.classList.add('active');
            
            const selectedNavItem = document.getElementById(`nav-item-${targetTabId}`);
            if(selectedNavItem) selectedNavItem.classList.add('active');

            reloadActiveIframe();
        }
    </script> <script>
    (function() {

    const COUNTRY_LANG_MAP = {

    };
    
    const RTL_LANGS = ['ar', 'fa', 'ur', 'he'];
    let isTranslating = false;
    
    // استخراج رمز الدولة
    function getCountryCode() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('country') || urlParams.get('countryCode') || localStorage.getItem('px_country') || 'US';
    }
    
    // جمع النصوص دون التعديل على الواجهة
    function collectTextNodes() {
    const nodes = [];
    const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT,
    {
    acceptNode: function(node) {
    if (!node.nodeValue.trim()) return NodeFilter.FILTER_SKIP;
    const parent = node.parentElement;
    if (!parent) return NodeFilter.FILTER_SKIP;
    const tag = parent.tagName.toLowerCase();
    if (['script', 'style', 'textarea', 'iframe', 'code', 'noscript'].includes(tag)) return NodeFilter.FILTER_SKIP;
    if (parent.classList.contains('no-translate') || parent.closest('.no-translate')) return NodeFilter.FILTER_SKIP;
    return NodeFilter.FILTER_ACCEPT;
    }
    }
    );
    
    while (walker.nextNode()) {
    nodes.push(walker.currentNode);
    }
    return nodes;
    }
    
    // الترجمة الصامتة دفعة واحدة (In-Memory Processing)
    async function translateBatch(targetLang) {
    if (isTranslating) return;
    isTranslating = true;
    
    const isRtl = RTL_LANGS.includes(targetLang.split('-')[0]);
    
    const nodes = collectTextNodes();
    if (nodes.length === 0) { isTranslating = false; return; }
    
    // حفظ النصوص الأصلية في الذاكرة
    nodes.forEach(node => {
    if (!node._originalText) node._originalText = node.nodeValue;
    });
    
    const cacheKey = `tr_cache_${targetLang}`;
    let cache = JSON.parse(localStorage.getItem(cacheKey) || '{}');
    
    const textsToTranslate = [];
    const pendingNodes = [];
    
    // معالجة النصوص في الذاكرة أولاً
    nodes.forEach(node => {
    const original = node._originalText.trim();
    if (!cache[original]) {
    textsToTranslate.push(original);
    pendingNodes.push(node);
    }
    });
    
    // جلب الترجمات المتبقية عبر API صامت إذا لم تكن في الكاش
    if (textsToTranslate.length > 0) {
    try {
    const uniqueTexts = [...new Set(textsToTranslate)];
    const delimiter = " ||| ";
    const combinedQuery = uniqueTexts.join(delimiter);
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(combinedQuery)}`;
    
    const response = await fetch(url);
    const data = await response.json();
    
    if (data && data[0]) {
    let translatedCombined = data[0].map(item => item[0]).join('');
    let translatedArray = translatedCombined.split(/\s*\|\|\|\s*/);
    
    uniqueTexts.forEach((orig, idx) => {
    if (translatedArray[idx]) {
    cache[orig] = translatedArray[idx];
    }
    });
    
    localStorage.setItem(cacheKey, JSON.stringify(cache));
    }
    } catch (err) {
    console.error("Silent translation fetch failed:", err);
    }
    }
    
    // تطبيق جميع التغيرات والاتجاه دفعة واحدة لمنع التقطيع أو الفلاش (No Glitch)
    requestAnimationFrame(() => {
    // 1. ضبط اتجاه حركة الصفحة ونمط المحاذاة
    document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', targetLang);
    document.body.style.direction = isRtl ? 'rtl' : 'ltr';
    document.body.style.textAlign = isRtl ? 'right' : 'left';
    
    // 2. تحديث كافة النصوص في شجرة HTML بضربة واحدة
    nodes.forEach(node => {
    const original = node._originalText.trim();
    if (cache[original]) {
    node.nodeValue = node._originalText.replace(original, cache[original]);
    }
    });
    
    isTranslating = false;
    });
    }
    
    // التشغيل المباشر والاستجابة للرسائل
    function initAutoTranslation(countryCode) {
    const code = (countryCode || getCountryCode()).toUpperCase();
    const targetLang = COUNTRY_LANG_MAP[code] || 'en';
    translateBatch(targetLang);
    }
    
    window.addEventListener('message', (event) => {
    if (event.data && (event.data.type === 'PEETX_SYNC_STATE' || event.data.country || event.data.countryCode)) {
    const country = event.data.country || event.data.countryCode;
    if (country) initAutoTranslation(country);
    }
    });
    
    document.addEventListener('DOMContentLoaded', () => {
    initAutoTranslation();
    });
    })();
