<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple-glow: #9d4edd;
            --purple-dark: #3c096c;
            --gold-bright: #ffd700;
            --gold-light: #ffe6a7;
            --bg-dark: #0a0512;
            --card-bg: rgba(20, 10, 35, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
        }

        .blob-1 {
            width: 450px;
            height: 450px;
            background: var(--purple-glow);
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 450px;
            height: 450px;
            background: var(--gold-bright);
            bottom: -100px;
            right: -100px;
            opacity: 0.2;
        }

        /* Moving Purple & Gold Gradient Border */
        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(
                60deg,
                var(--purple-glow),
                var(--gold-bright),
                #5a189a,
                #ffb703,
                var(--purple-glow)
            );
            background-size: 300% 300%;
            animation: borderMove 5s linear infinite;
            box-shadow: 0 20px 50px rgba(157, 78, 221, 0.25),
                        0 10px 30px rgba(255, 215, 0, 0.15);
        }

        @keyframes borderMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Card Interior */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            border-radius: 21px;
            padding: 55px 40px;
            text-align: center;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gold-light);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--gold-bright);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-bright);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Moving Line Accent */
        .animated-line {
            width: 100px;
            height: 4px;
            margin: 0 auto 30px auto;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--purple-glow), var(--gold-bright));
            position: relative;
            overflow: hidden;
        }

        .animated-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            100% { left: 100%; }
        }

        /* Typography */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #ffffff 40%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.25;
        }

        p {
            color: #c4b5fd;
            font-size: 1.05rem;
            line-height: 1.7;
            font-weight: 300;
            max-width: 460px;
            margin: 0 auto;
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 20px;
            }
            h1 {
                font-size: 1.75rem;
            }
            p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="card-wrapper">
        <div class="card">
            
            <div class="status-badge">
                <span class="status-dot"></span>
                System Maintenance
            </div>

            <div class="animated-line"></div>

            <h1>Adding New Features</h1>
            
            <p>
                We are currently performing scheduled maintenance to upgrade our system and release new features. We will be back online shortly.
            </p>

        </div>
    </div>

</body>
</html>
